name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build-logic 的 Java toolchain 是 21，Gradle 必须运行在 JDK 21 上。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 预装了完整 Android SDK（ANDROID_HOME 已就绪）。
      # 不使用 android-actions/setup-android：其内部 sdkmanager 会尝试安装已废弃的
      # `tools` 包，在当前 runner 镜像上以 exit code 1 失败。这里只需接受 license。
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build (debug + release)
        run: ./gradlew assemble --console=plain --stacktrace

      - name: Unit tests
        run: ./gradlew test --console=plain --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # 打 v* tag 时自动创建 GitHub Release 并附上 APK。
  # 依赖 build job 全绿（含全部单元测试），测试不过不会发版。
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # 独立 job 拿不到 build job 的构建产物，从 artifact 取回。
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pick APK to publish
        id: apk
        run: echo "path=$(find apk -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="${{ steps.apk.outputs.path }}"
          name="Notdisk-v${{ steps.ver.outputs.version }}.apk"
          cp "$apk" "$name"
          sha=$(sha256sum "$name" | cut -d' ' -f1)
          {
            echo "## Notdisk v${{ steps.ver.outputs.version }}"
            echo
            echo "下载 \`$name\`（debug 签名，Android 8.0+ / minSdk 26）。"
            echo
            echo "SHA-256：\`$sha\`"
            echo
            echo "由 CI 自动构建发布，来源 commit：\`${GITHUB_SHA}\`。"
            echo
            echo "变更内容见 [commits](https://github.com/${GITHUB_REPOSITORY}/compare/$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo 'v0.1.0')...${GITHUB_REF_NAME})。"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Notdisk v${{ steps.ver.outputs.version }}" \
            --notes-file notes.md
