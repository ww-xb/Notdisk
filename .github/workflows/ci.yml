name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build-logic 的 Java toolchain 是 21，Gradle 必须运行在 JDK 21 上。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 预装了完整 Android SDK（ANDROID_HOME 已就绪）。
      # 不使用 android-actions/setup-android：其内部 sdkmanager 会尝试安装已废弃的
      # `tools` 包，在当前 runner 镜像上以 exit code 1 失败。这里只需接受 license。
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build (debug + release)
        run: ./gradlew assemble --console=plain --stacktrace

      - name: Unit tests
        run: ./gradlew test --console=plain --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # 打 v* tag 时自动创建 GitHub Release 并附上 APK。
  # 依赖 build job 全绿（含全部单元测试），测试不过不会发版。
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # The release job runs on a fresh runner and had no checkout, which is why it previously could
      # not read anything from the repository. Both the notes file and the `git describe` below need a
      # working tree, so this step is required — not decorative.
      #
      # `fetch-depth: 0` + `fetch-tags: true` are equally required, and their absence fails *silently*:
      # `actions/checkout@v4` defaults to a shallow, tagless clone, so `git describe` cannot find the
      # previous tag and the `|| echo 'v0.1.0'` fallback kicks in. The result would be a compare link
      # claiming every release is the first change since v0.1.0 — a wrong link, not a failed build.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 独立 job 拿不到 build job 的构建产物，从 artifact 取回。
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pick APK to publish
        id: apk
        run: echo "path=$(find apk -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      # 发布说明来自仓库里维护的 RELEASE_NOTES.md，而不是写死在工作流里。
      # 之前每个版本的说明都是硬编码的 echo，一旦忘记改，v0.2.1 的 release 会原样复述 v0.2.0
      # 的要点 —— 一份与代码不符的发布说明比没有说明更糟。哈希与来源 commit 由 CI 现场生成，
      # 因为它们只有在构建完成后才知道。
      - name: Compose release notes
        run: |
          apk="${{ steps.apk.outputs.path }}"
          name="Notdisk-v${{ steps.ver.outputs.version }}.apk"
          cp "$apk" "$name"
          sha=$(sha256sum "$name" | cut -d' ' -f1)
          echo "RELEASE_ASSET=$name" >> "$GITHUB_ENV"
          {
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            else
              echo "## Notdisk v${{ steps.ver.outputs.version }}"
            fi
            echo
            echo "---"
            echo
            echo "### 构建信息"
            echo
            echo "- 产物：\`$name\`（debug 签名，**Android 15+ / minSdk 35**）"
            echo "- SHA-256：\`$sha\`"
            echo "- 来源 commit：\`${GITHUB_SHA}\`"
            echo "- 由 CI 自动构建发布；上游提交见 [commits](https://github.com/${GITHUB_REPOSITORY}/compare/$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo 'v0.1.0')...${GITHUB_REF_NAME})。"
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The APK path is carried in `GITHUB_ENV` by the step that produced it, so this step cannot
          # reference a variable it never defined. `RELEASE_ASSET` is the renamed file, not the
          # downloaded build output.
          gh release create "$GITHUB_REF_NAME" "$RELEASE_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Notdisk v${{ steps.ver.outputs.version }}" \
            --notes-file notes.md
          # Verify what GitHub actually accepted against the local artifact: a release that exists but
          # whose asset failed to upload is a "green CI, broken download" that only a user discovers.
          echo "--- published assets ---"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'
