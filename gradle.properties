# JVM: the container has JDK 21; AGP 8.10 requires 17+.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=35

# Kotlin
kotlin.code.style=official
# Compose compiler is applied per-module via the org.jetbrains.kotlin.plugin.compose plugin.
